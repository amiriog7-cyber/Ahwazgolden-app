name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Fix project structure
        run: |
          mkdir -p app/src/main/java/com/ahwazgolden/calculator
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/assets
          mkdir -p gradle/wrapper
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp MainActivity.java app/src/main/java/com/ahwazgolden/calculator/
          cp MyFirebaseService.java app/src/main/java/com/ahwazgolden/calculator/
          cp google-services.json app/
          cp activity_main.xml app/src/main/res/layout/
          cp strings.xml app/src/main/res/values/
          cp styles.xml app/src/main/res/values/
          cp calculator.html app/src/main/assets/
          cp ic_launcher.png app/src/main/res/mipmap-hdpi/
          cp ic_launcher_round.png app/src/main/res/mipmap-hdpi/
          cp gradle-wrapper.properties gradle/wrapper/
          chmod +x gradlew

      - name: Create app/build.gradle
        run: |
          cat > app/build.gradle << 'GRADLE'
          plugins {
              id 'com.android.application'
              id 'com.google.gms.google-services'
          }
          android {
              namespace 'com.ahwazgolden.calculator'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ahwazgolden.calculator"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation platform('com.google.firebase:firebase-bom:32.7.0')
              implementation 'com.google.firebase:firebase-messaging'
          }
          GRADLE

      - name: Create root build.gradle
        run: |
          cat > build.gradle << 'GRADLE'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
                  classpath 'com.google.gms:google-services:4.4.0'
              }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          GRADLE

      - name: Build APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.1.1-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt/gradle
          /opt/gradle/gradle-8.1.1/bin/gradle assembleRelease --stacktrace

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo $KEYSTORE_BASE64 | base64 -d > ahwazgolden-release.jks
          APKSIGNER=$(find /usr/local/lib/android/sdk/build-tools -name "apksigner" | head -1)
          $APKSIGNER sign \
            --ks ahwazgolden-release.jks \
            --ks-pass pass:Ahwaz1345 \
            --key-pass pass:Ahwaz1345 \
            --ks-key-alias ahwazgolden \
            --out app-release-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AhwazGolden-Calculator
          path: app-release-signed.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: AhwazGolden-Calculator
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
